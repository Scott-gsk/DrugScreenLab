    - 2026-09-22 EXP-035 完成（工作包 F 域差异与依赖能力，F2 经当日审计修复重跑）：F2 关键修复——EXP-030 predictions.parquet (sample,gene) 标签与数值行序错位（gene-major 数值 vs sample-major 标签），09-21 版按标签重建产生伪相关（HD 层3 0.458/98% CI 正），按书写行序重建与 arm_summary 逐折精确一致后重跑（HD 真实 0.0006）。F1：同癌种域分类 0.903（置换 p95 0.588）、泛癌 0.356 不可分、跨研究细胞系距离 0.98>PDO-细胞系 0.845（混杂不可归因）、误差-距离相关全跨零。F2：层1 AUROC ZS 0.9971；层2 ZS 分癌种 0.02-0.03、HD 癌种内≈0 至负、谱系基因留出复现 0.325 vs 0.102（CTNNB1/GATA5 入选）；层3 个体化 ZS 0.023（置换 p=0.0）显著、HD 0.0006 不显著、必需基因 0.049-0.070、逐基因 CI>0 仅 5-6%——个体化信号微弱、集中于必需基因、仅在零样本臂稳定。F3：ridge 0.031>低秩 0.028>MLP 0.015>通路掩码 0.012≈随机分组 0.010（固定通路结构无增益）。
