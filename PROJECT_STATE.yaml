    - 2026-09-20 EXP-030 完成（判定 RULE1_TRANSFER_SUPPORTED_ZS_DIRECT，第二波首个明确正向迁移证据）：五臂依赖图迁移（1,066 细胞系→162 类器官，13,448 配对基因，individual 整组 5 折，7,524 秒）。主终点逐基因 Spearman 宏平均：ZS 零样本 0.0294 追平 HD 从头训练 0.0321（源内验证 0.1610，61.3% 基因为正）；CAL 校准 0.0211 有害、DA 域适应 0.0008 失败。配对差 pooled 口径 ZS vs B0 +0.159 [+0.149,+0.168] 2000 次重采样全正（B0 逐基因常数无定义、pooled 负值含折间伪变异，幅度谨慎解读）。必需基因 AUROC 0.9971 五臂最高。五条规律：①零样本迁移成立 ②信号集中于必需基因（中位 0.079 vs 0.022 3.6 倍，Top 基因=增殖/基础机器 TP53/CDK4/MYBL2/ORC，最差=谱系特异 TF HOXC13/ELAVL2 与特异代谢 ACSS1/ETFDH；与目标域方差无关 p=0.16）③有/无近邻无差异（EXP-029 覆盖缺口障碍不适用基因依赖任务，边界澄清）④CAL 小样本校准过拟合（38.2% 基因劣于 ZS）⑤DA 共享码 R2 为负+域分类 0.81（实现失败非方向失败，需换 CORAL/对抗对齐）。EXP-031 输入：必需基因规律与基因级图谱可作药敏辅助特征；CAL/OrthoAE 路径不再投入。运行前 pytest 188 通过；报告 docs/reports/dependency_transfer_EXP030_20260920.md；下一实验 EXP-031（多来源闸门，待预登记）。
