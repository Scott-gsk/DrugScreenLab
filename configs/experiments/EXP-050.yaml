    boundary: "条件和结构键只能来自响应盲门控白名单。允许读取白名单train响应值用于训练、train/dev响应值用于内层选停；heldout来源响应值只能在模型冻结且预测已落盘后读取。PDO处理标签、直接药敏数值和outer/locked结果不读取。train/dev PatientID零交叉及34个药敏来源对象排除是硬门。"
    stop: "累计XPert子任务GPU上限10小时，失败与重跑全计入；EXP-050全包上限48 GPU小时。预计完整attempt 8.152780639 GPU小时。预算不足不启动下一attempt，交付已发生attempt的失败证据。"
