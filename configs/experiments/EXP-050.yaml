    ctrp_replicates: "median finite aac_published across experiment/media rows within cellid x drugid; then median across mapped cell lines sharing PatientID"
    lincs_replicates: "median exact-identity pert_id condition magnitudes within LINCS cell x InChIKey x dose x time; then median across mapped cell lines sharing PatientID"
