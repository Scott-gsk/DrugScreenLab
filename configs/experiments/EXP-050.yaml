source_lincs_ctrp_functional_increment_exploratory:
  run_id: 20261001_lincs_ctrp_functional_increment_v1
  status: completed_exploratory
  role: "方案3.4 CPU-only来源探索：检验预定义Hallmark基因集响应能否在逐药均值、整体扰动幅度及增殖/应激控制外改善来源对象药敏预测；不验证PDO药效、不选药"
  inputs:
    source_pairs: artifacts/experiments/EXP-050/20261001_lincs_ctrp_transfer_association_v3/patient_level_pairs.parquet
    source_response: "source_pairs.aac; CTRPv2 published AAC, higher means more sensitive; reuse train/val-only exact-identity pairs and metadata-selected LINCS exposures"
    lincs_conditions: data/processed/lincs/GSE92742/continuous_conditions_v2/conditions.parquet
    lincs_deltas: data/processed/lincs/GSE92742/continuous_conditions_v2/condition_delta.npy
    lincs_gene_axis: data/processed/lincs/GSE92742/continuous_contract_v2/genes.json
    lincs_gene_symbols: data/raw/lincs/GSE92742/GSE92742_Broad_LINCS_gene_info.txt.gz
    hallmark_sets: data/raw/exp013/msigdb/h.all.v2023.2.Hs.symbols.gmt
    identity_split: artifacts/experiments/EXP-007/CCLE_CONTEXT_IDENTITY_SPLIT.json
  protocol:
    analysis_unit: "One DepMap PatientID source-origin x exact full InChIKey selected dose/time pair. Cell lines sharing a PatientID count once; source-origin objects are not PDO patients."
    exposure_and_compounds: "Reuse v3 exact full-InChIKey patient_level_pairs and its metadata-only selected dose/time. Retain compounds with at least 10 unique source origins by coverage only; never read v3 rho to select a drug or feature. Do not reselect dose/time from AAC."
    features: "Recompute the existing 978-gene mean absolute response magnitude and verify parity with v3. Map all 50 Hallmark v2023.2 gene sets to exact LINCS Entrez-symbol rows; each feature is the mean signed matched-control delta across genes in that set, aggregated median by LINCS cell then median by source origin at the frozen drug exposure."
    nuisance_controls: "Per-drug AAC training-fold mean; overall 978-gene absolute perturbation magnitude; six predeclared Hallmarks: E2F targets, G2M checkpoint, MYC targets V1 (proliferation), unfolded-protein response, TNFA/NFKB signaling, and reactive-oxygen response (stress)."
    model: "One fixed Ridge regression (alpha=1.0); predict AAC residuals after fold-training per-drug centering/scaling. Center response features within drug and standardize using training-fold rows only. No hyperparameter search, feature selection, or candidate selection."
    grouped_validation: "Deterministic five-fold GroupKFold on the unique PatientID source-origin key; all drug observations of a source origin stay in one fold. The 10 frozen locked_eval identities remain excluded before outcome values are read."
    primary_endpoint: "Out-of-fold normalized squared AAC error, each squared residual divided by that drug's training-fold AAC standard deviation squared; average drugs within each source origin and then average source origins equally. Lower is better. Primary increment = nuisance-control error minus full 50-Hallmark error; positive favors Hallmark features. Preserve exact row keys and denominators."
    equal_size_random_control: "50 panels; each panel adds 44 random gene groups to the same nuisance baseline, matching the exact LINCS-axis gene count of each of the 44 non-control Hallmark sets. Sample genes without replacement within each group, use fixed seed 20261001, and do not consult AAC."
    source_object_permutation: "99 deterministic permutations. Within every fold separately permute the entire source-origin feature block among training origins and among held-out origins; map all drug observations by the same origin permutation and exact drug key. Do not shuffle individual genes, rows, or compounds independently. Drop unmatched donor-origin x drug feature pairs and report effective denominators."
    inference_boundary: "Previously viewed CTRPv2 outputs make the work package exploratory even with grouped folds. Report point estimates, random-control distribution, source-object permutation distribution, exact-key paired out-of-fold predictions and negative/undefined cases; no p-value, interval, independent confirmation, PDO efficacy, drug ranking, or generalization claim."
  forbidden: [target_pdo_expression, target_treated_expression, outer_test_labels, locked_eval_labels, target_prediction, dose_time_reselection_from_aac, drug_ranking, candidate_selection, hyperparameter_search, p_value_claim, independent_confirmation]
  gpu_hours: 0
  outputs:
    directory: artifacts/experiments/EXP-050/20261001_lincs_ctrp_functional_increment_v1
    files: [summary.json, oof_predictions.parquet, random_panel_scores.tsv, source_object_permutation_scores.tsv, per_drug_fold_coverage.tsv, run_manifest.json]

source_rnaseq_to_lincs_scale_reconstruction:
  run_id: 20261001_source_scale_mapping_v1
  status: preregistered_pending_execution
  role: "来源侧尺度重建开发；评估DepMap log2(TPM+1)能否映射到LINCS 24h X_ctl基线，仅回答来源尺度重建，不支持PDO预测或药效结论"
  inputs:
    depmap_expression: data/processed/depmap/24q2_rnaseq_exact978/ccle_24q2_exact978_log2tpm.npy
    depmap_mapping: data/processed/depmap/24q2_rnaseq_exact978/ccle_24q2_exact978_mapping.json
    depmap_identity: artifacts/experiments/EXP-007/CCLE_CONTEXT_IDENTITY_SPLIT.json
    lincs_controls: data/processed/lincs/GSE92742/continuous_contract_v2/controls.parquet
    lincs_control_matrix: data/processed/lincs/GSE92742/exact978_cache_v1/exact978_cache.npy
    lincs_gene_axis_contract: data/processed/lincs/GSE92742/continuous_contract_v2/genes.json
  protocol:
    identity: "Frozen response-blind EXP-007 identity and split assignments only; verify exact DepMap/LINCS cell identity, PatientID source-origin grouping, aliases/derived lines, and one source object per independent unit; exclude locked_eval."
    eligible_pairs: "Only exact 24-hour LINCS control groups with finite controls. Coverage audit predicts 13 training and 2 validation source objects; recalculate from metadata and stop on mismatch until explained."
    target_boundary: "No PDO expression, target treated expression, target labels, outer test, or locked_eval data. No target prediction."
    aggregation: "Average finite technical control instances within control_group_id, then average unique finite control-group profiles within source object so each source object receives equal weight. DepMap rows sharing one verified PatientID are aggregated before fitting/scoring."
    baseline: "Per-gene median LINCS control vector fit from the current training fold only."
    candidate_1: "Per-gene affine OLS predicting LINCS X_ctl from DepMap log2(TPM+1), fit on the current training fold only; fit 978 independent gene-wise intercept/slope pairs."
    candidate_2: "Per-gene robust location-scale transfer: train-fold DepMap median and MAD, mapped to train-fold LINCS-control median and MAD; predict target median + source robust z-score * target MAD. All statistics use the current training fold only; zero-MAD genes map to the target median."
    selection: "13-object leave-one-source-object-out CV; select at most one candidate only if its mean equal-object, equal-gene train-CV normalized MSE is lower than the fold-specific median baseline. If neither improves, report a negative result and stop."
    primary_metric: "Per-object mean squared error over 978 genes, scaled by the current fold's per-gene LINCS control SD squared; average genes equally and then source objects equally. Lower is better. Preserve per-object scores and all zero-SD exclusions."
    secondary_metrics: "Per-object Pearson and Spearman across genes; raw LINCS control-expression profile MAE/RMSE and mean bias. Undefined values remain null with reasons and denominators."
    validation: "After development selection, refit the selected candidate on all 13 training source objects and evaluate once on the 2 frozen validation source objects; no tuning or model choice from validation. Report each validation object separately; no bootstrap, p-value, or broad generalization claim."
    decision_boundary: "This answers only whether a simple mapping reconstructs LINCS baseline better than the median among these 13 source origins and whether two held-out origins show obvious failure. It does not establish GSE287429 scale compatibility, dose/time match, target missing-gene handling, PDO transfer, or screening utility."
  exposure_disclosure: "An earlier protocol review used an unsupported 121/8 cohort and 5% mapped-model-response gate. GPT-6.1-Sol/medium withdrew that gate after exact 24h coverage audit; this preregistration uses the verified 13/2 source-object set and no target-model gate."
  forbidden: [target_pdo_expression, target_treated_expression, outer_test_labels, locked_eval, ctrp_endpoint, drug_ranking, target_prediction]
  gpu_hours: 0
  outputs:
    directory: artifacts/experiments/EXP-050/20261001_source_scale_mapping_v1
    files: [coverage.json, source_object_crosswalk.tsv, cv_scores.tsv, validation_scores.tsv, model_parameters.npz, summary.json, run_manifest.json]

