    lincs_perturbation_identity: data/raw/lincs/GSE92742/GSE92742_Broad_LINCS_pert_info.txt.gz
  protocol:
    training: "仅使用响应盲身份/暴露白名单内61个非目标PatientID对象的9,889个精确10 uM x 24 h条件，需逐条件具备完整InChIKey与XPert分子特征；训练全集不限于直接药敏参照药物。直接参照覆盖138个药物键，其中111个在train有支持。所有拟合尺度和逐药均值只由train拟合。"
    inner_dev: "6个不与train或药敏目标交叉的PatientID来源对象，共2,402个合格条件；早停及模型选择仅用train/dev共有的78个完整结构键，其实际dev评分分母为244个条件；最低object-macro NMSE选轮，较低为好。"
    heldout_source: "所有34个直接药敏参照PatientID从训练、内层开发、尺度拟合和选停排除；直接药物键上有精确10 uM x 24 h配对支持的462个对象-药物对共467个条件、分布于10个对象，仅在模型冻结并持久化预测后读取其响应，按独立对象评价迁移。13个对象有任意药物的精确LINCS暴露，不等同于直接药物键配对支持对象数。"
