  normalized_error_decomposition: residual_variance_minus_twice_mean_error_covariance
  required_contrasts: [nearest_shrunk_vs_per_drug_mean, nearest_shrunk_vs_random_shrunk]
  continuation_gate: nearest_shrunk_relative_gain_vs_per_drug_mean_at_least_0.05_and_nmse_below_random_shrunk

