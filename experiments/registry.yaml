experiments:
  - id: EXP-001
    title: Phase 0 / P0 Data Readiness & Identity Harmonization
    status: accepted
    hypothesis: >
      当前 DrugScreenLab 的数据资产、身份体系和预处理基础能够被整理成可审计、
      可复现、无明显 identity leakage，且支持后续 Δ978 perturbation benchmark 的
      Phase-0 research data foundation。
    primary_endpoint: phase_0_readiness_verdict
    approved_by: user
    approved_on: 2026-08-11
    record: experiments/records/EXP-001.md
  - id: EXP-002
    title: Level-3 Exact-978 Delta978 Baseline Under Leakage-Safe Cold Splits
    status: accepted_negative_result
    hypothesis: >
      在冻结的 GSE92742 Level-3 exact-978 landmark space、matched vehicle、compound/context
      identity 与 leakage-safe cold split contract 下，context-conditioned Delta978 baseline
      能够在 cold-drug 和 cold-context 评估中稳定优于无条件简单 baseline。
    primary_endpoint: conditional_baseline_ood_improvement_over_global_baseline
    approved_by: user
    approved_on: 2026-08-11
    record: experiments/records/EXP-002.md
  - id: EXP-003
    title: Proposed Learned Pre-treatment Context Generalization in Exact-978 Space
    status: deferred_valid_design
    hypothesis: >
      在冻结的 GSE92742 exact-978 数据契约上，在相同 drug/dose/time、train split、
      target 和优化预算下，vehicle-control proxy context representation 的低容量模型
      能在 cold-context primary-supported-DRT strata 超过 matched DRT-only baseline，
      而不使用 held-out context treatment labels、test aggregate statistics 或 shared controls。
    primary_endpoint: cold_context_primary_supported_drt_paired_pearson_improvement_over_matched_drt_only_baseline
    approved_by: null
    approved_on: null
    record: experiments/records/EXP-003.md
  - id: EXP-004
    title: Genetic-to-Chemical Low-Data Transfer FAST Extension
    status: fast_result_ready_pending_review
    hypothesis: >
      在共享 Context + Perturbagen -> Delta978 接口中，遗传扰动监督预训练能够在固定
      chemical test 上降低化学监督需求，并在 20%/10% chemical supervision regime 保持
      或提高预测 ranking quality。
    primary_endpoint: frozen_chemical_test_spearman_transfer_minus_chemical_only
    approved_by: user_autonomous_extension_authorization
    approved_on: 2026-08-13
    record: experiments/records/EXP-004.md
  - id: EXP-005
    title: XPert Additive KPGT and UniPert Perturbagen Tokens
    status: fast_complete_chemical_backbone_champion_xpert
    hypothesis: >
      在固定的官方 XPert L1000 split、训练预算、loss 与评估契约下，保留官方 HG + UniMol
      路径并将 KPGT、UniPert 作为独立投影 token 追加至官方 drug attention sequence，能够改善
      cold-cell / cold-drug Delta978 预测，并在不使用 PRISM 标签训练或选模的前提下改善冻结的
      CRC Disease Reversal -> Broad PRISM ranking 诊断。
    primary_endpoint: cold_cell_and_cold_drug_heldout_delta978_row_spearman_increment_over_xpert_A
    approved_by: user_autonomous_extension_authorization
    approved_on: 2026-08-13
    record: experiments/records/EXP-005.md
  - id: EXP-006
    title: Genetic to Chemical Transfer Under Low Chemical Supervision
    status: quantitative_complete_genetic_pretrain_hurt_chemical_delta978
    hypothesis: genetic pretraining reduces chemical perturbation supervision required for exact978 response prediction and downstream screening utility
    primary_endpoint: frozen_chemical_test_spearman_transfer_minus_chemical_only_at_20pct_and_10pct_unique_compounds
    approved_by: user_program_direction_reset
    approved_on: 2026-08-13
    record: experiments/records/EXP-006.md
  - id: EXP-007
    title: Full Observed Oracle Screening Translation
    status: oracle_near_null_fail_rule_audit_complete
    hypothesis: >
      在 Observed chemical ∩ CRC exact contexts ∩ PRISM compounds ∩ canonical dose/time
      的最大 support 上，Observed Δ978 → Disease Reversal 的 Top-10/20/50 lift 与 NDCG
      excess 显著高于 line-wise permutation null。
    primary_endpoint: top10_20_50_lift_and_ndcg_excess_over_permutation_null
    approved_by: user_program_execution_mandate_2026-08-13
    approved_on: 2026-08-13
    record: experiments/records/EXP-007.md
  - id: EXP-008
    title: Full SDST Drug-Target-Pathway Residual
    status: archived_without_result_implementation_removed
    hypothesis: >
      在官方完整 SDST（78,453 × 978，10 μM / 24 h）上，冻结官方 XPert 主干，
      只训练药物–靶点–通路低容量残差后，冷药物全量测试的行宏 Δ978 斯皮尔曼
      比冻结官方 XPert 至少高 0.02，且预测标准差 > 0.01、相对主干下降不超过 20%。
    primary_endpoint: cold_drug_full_sdst_row_macro_delta978_spearman_increment_over_frozen_xpert
    approved_by: user_long_running_execution_authorization
    approved_on: 2026-08-16
    record: experiments/records/EXP-008.md
    supersedes:
      - legacy_exp008_champion_draft_removed_20260823
      - disease_signature_swap_gate
  - id: EXP-010
    title: PharmaFormer to mCRC PDO to Breast PDO One-Day Validation
    status: complete_promising_fast_with_limitations
    hypothesis: >
      在患者级严格隔离的 mCRC PDO 上，GDSC2/CMP 预训练的 PharmaFormer 经短程
      mCRC 微调后，比不做微调的同一 checkpoint 提高患者等权药物排序质量，并且该
      方向能在公开乳腺癌 PDO 分析输入上获得独立、有限范围的外部支持。
    primary_endpoint: patient_macro_within_pdo_drug_spearman_m3_minus_m2
    approved_by: user_explicit_implementation_authorization
    approved_on: 2026-08-23
    record: experiments/records/EXP-010.md
    result: >
      M3 相对 M2 的患者宏 Spearman 提升 0.2486（2000 次患者 bootstrap 95% CI
      0.2190–0.2769），达到 PROMISING_FAST；但 M3 Spearman 0.7277 未超过 M0 的
      0.7505。GSE303509 上 M3 五折 ensemble rho 0.4286、14/21，达到限定的 SUPPORTS。
  - id: EXP-011
    title: Cell-Line-Gated Multi-Cohort PDO Transfer Validation
    status: approved_running
    hypothesis: >
      在冻结的细胞系泛化门槛通过后，GDSC2/CMP 预训练 PharmaFormer 的低容量PDO
      adapter 能在 mCRC 与肝胆癌直接表达—药敏配对的患者/PDO留出测试中，改善逐药物
      跨患者排序，同时维持对强线性基线的非劣表现。
    primary_endpoint: equal_cohort_macro_per_drug_patient_spearman_adapter_minus_source_only
    approved_by: user_explicit_implementation_authorization
    approved_on: 2026-08-23
    record: experiments/records/EXP-011.md
